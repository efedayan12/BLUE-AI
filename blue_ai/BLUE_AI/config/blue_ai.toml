[general]
app_name = "BLUE_AI"
version = "1.0.0"
log_level = "INFO"
data_dir = "data"
auto_action = true          # Otomatik aksiyon modu
default_profile = "balanced"

[polling]
system_monitor_interval = 2.0    # saniye
process_check_interval = 5.0
network_check_interval = 3.0
security_scan_interval = 60.0
file_watch_interval = 10.0
cleanup_interval = 3600.0       # 1 saat

[thresholds]
cpu_warning = 80
cpu_critical = 95
ram_warning = 85
ram_critical = 95
disk_warning = 85
disk_critical = 95
gpu_temp_warning = 80
gpu_temp_critical = 90
cpu_temp_warning = 75
cpu_temp_critical = 90
process_cpu_hog = 50            # Tek süreç CPU limiti
process_ram_hog_mb = 2048       # Tek süreç RAM limiti (MB)

[profiles.balanced]
name = "Dengeli Mod"
cpu_priority = "normal"
power_plan = "balanced"
max_background_processes = 50
auto_cleanup = true
screen_timeout = 300

[profiles.gaming]
name = "Oyun Modu"
cpu_priority = "high"
power_plan = "high_performance"
max_background_processes = 20
auto_cleanup = false
kill_unnecessary = true
disable_notifications = true
screen_timeout = 0

[profiles.work]
name = "İş Modu"
cpu_priority = "normal"
power_plan = "balanced"
max_background_processes = 40
auto_cleanup = true
focus_mode = true
screen_timeout = 600

[profiles.power_saver]
name = "Tasarruf Modu"
cpu_priority = "below_normal"
power_plan = "power_saver"
max_background_processes = 15
auto_cleanup = true
reduce_brightness = true
screen_timeout = 120

[plugins]
system_monitor = true
process_manager = true
file_manager = true
performance = true
security = true
network = true
scheduler = true
startup = true
cleaner = true
power = true
updater = true

[security]
scan_open_ports = true
monitor_usb = true
check_file_integrity = true
suspicious_process_detection = true
whitelist = ["explorer.exe", "svchost.exe", "csrss.exe", "dwm.exe", "taskmgr.exe"]

[network]
monitor_bandwidth = true
dns_cache_cleanup = true
ping_targets = ["8.8.8.8", "1.1.1.1"]

[cleaner]
temp_dirs = ["$TEMP", "$TMP"]
browser_cache = true
recycle_bin_days = 30
windows_update_cache = true

[dashboard]
enabled = true
host = "127.0.0.1"
port = 8484

[llm]
enabled = true
provider = "ollama"
model = "gemma3:1b"              # Gemma 3 1B — en hızlı seçenek, RTX 3050'de ~0.5s yanıt
base_url = "http://localhost:11434"
temperature = 0.3
max_tokens = 256
context_window = 2048
gpu_layers = 99                  # RTX 3050 — tüm katmanları GPU'da çalıştır

[brain]
max_history = 8           # Konuşma geçmişi (20'den düşürüldü — daha az token)
max_tool_steps = 5        # Maksimum tool çağrı zinciri
default_language = "tr"   # Varsayılan dil (tr/en — otomatik algılama da var)
auto_confirm_level = 2    # Bu seviyeye kadar otomatik onay (1=auto, 2=notify)

[voice]
enabled = true            # Ses sistemi aktif

# ── STT Motor Seçimi ──────────────────────────────────────────────────────────
# "vosk"    → Vosk-API  : offline, hızlı başlangıç (~1s), gerçek zamanlı streaming
# "whisper" → Faster-Whisper: yüksek doğruluk, model yükleme ~3-5s, sonra hızlı
stt_engine = "whisper"

# Whisper ayarları (stt_engine = "whisper" iken geçerli)
stt_model = "small"       # tiny (~75MB,hızlı) | small (~250MB,önerilen) | medium (~750MB)
stt_device = "cpu"        # cpu | cuda (GPU, cublas gerektirir)
stt_compute = "int8"      # int8 (cpu) | int8_float16 (gpu)

# Vosk ayarları (stt_engine = "vosk" iken geçerli)
vosk_model_path = ""      # Boş → otomatik indirir (data/models/vosk-model-small-tr-0.3)
vosk_model_size = "small" # "small" (~45MB, hızlı) | "large" (~1.5GB, daha doğru)

# Ortak ses ayarları
tts_engine = "edge"       # edge (online, yüksek kalite) | pyttsx3 (offline)
tts_voice = "tr-TR-AhmetNeural"
hotword = "Hey Blue"
silence_threshold = 0.010  # RMS sessizlik eşiği (0.01=hassas ... 0.05=kaba)
silence_duration = 1.0     # Kaç saniyelik sessizlik = konuşma bitti
continuous_listen = false  # true = sürekli arka planda dinle
