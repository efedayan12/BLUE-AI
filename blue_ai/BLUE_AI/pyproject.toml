[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "blue-ai"
version = "1.0.0"
description = "BLUE_AI — Bilgisayar Yönetim Yapay Zekası"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "apscheduler>=3.10.0",
    "scikit-learn>=1.4.0",
    "watchdog>=4.0.0",
    "wmi>=1.5.1",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
blue = "blue_ai.cli.app:cli_app"

[tool.setuptools.packages.find]
where = ["."]
